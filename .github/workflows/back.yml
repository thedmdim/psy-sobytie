name: build and deploy backend

on:
  push:
    branches:
      - master
    paths:
      - 'back/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
 
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
 
      - uses: docker/build-push-action@v6
        with:
          context: ./back
          push: true
          tags: ghcr.io/thedmdim/new.psy-sobytie/back:latest
 
  deploy:
    needs: build
    name: deploy image
    runs-on: ubuntu-latest
    steps:
      - name: prepare ssh
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
 
      - name: update backend on the server
        run: |
          ssh deploy@$SERVER_IP \
          "docker compose -f /home/deploy/docker-compose.yml up --pull always -d back && docker image prune -f"
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
 
