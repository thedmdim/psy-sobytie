{{ define "css" }}
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/specialists.css">
{{ end }}

{{ define "main" }}

<nav class="navbar has-shadow" role="navigation" aria-label="specialists navigation">
  <div class="container">
  <div class="navbar-brand">
    <a class="navbar-item" href="/" id="logo">
      <figure class="image">
        <img class="is-rounded" src="/images/logo.png">
      </figure>
    </a>
  </div>
  <div class="navbar-menu is-active">
  {{ range .Params.nav }}
    <a class="navbar-item js-filter-btn" href="#" data-filter="{{ .label }}">{{ .label }}</a>
  {{ end }}
  </div>
  </div>
</nav>

<section class="section pt-3 pb-0">
  <div class="container">
    <figure class="image">
      <img src="specialists.png" alt="Команда специалистов">
    </figure>
  </div>
</section>

<section class="section pt-4">
  <div class="columns is-multiline is-variable is-4 specialists-grid">
    {{ range .Params.specialists }}
      <div id="{{ .slug }}" class="column" data-categories='{{ delimit .categories "," }}'>
        <div class="card">
          <div class="card-image">
            <figure class="image is-1by1">
              <img src="{{ .slug }}/{{ .photo }}" alt="">
            </figure>
          </div>
          <div class="card-content has-text-centered">
            <p class="title is-6 mb-4">{{ .name }}</p>
            <div class="buttons is-centered">
              <a class="button js-signup-btn" href="#contact" data-specialist="{{ .name }}">Записаться</a>
              <a class="button detail-btn" href="/specialists/{{ .slug }}/">Подробнее</a>
            </div>
          </div>
        </div>
      </div>
    {{ end }}
  </div>
</section>

<section class="section" id="contact">
  <div class="container">
    <h2 class="title is-3 mb-5">Форма для записи</h2>
    <form class="signup-form" method="POST" action="/submit">
      <input type="hidden" name="from" value="Специалисты">
      <div class="field">
        <label class="label" for="name">Имя</label>
        <div class="control">
          <input class="input" type="text" id="name" name="name" placeholder="Имя" required>
        </div>
      </div>
      <div class="field">
        <label class="label" for="phone">Телефон</label>
        <div class="control">
          <input class="input" type="tel" id="phone" name="phone" placeholder="+7" required>
        </div>
      </div>
      <div class="field">
        <label class="label" for="specialist">Специалист</label>
        <div class="control">
          <div class="select is-fullwidth">
            <select id="specialist" name="specialist">
              <option value="">Выберите специалиста</option>
              {{ range .Params.specialists }}
              <option value="{{ .name }}">{{ .name }}</option>
              {{ end }}
            </select>
          </div>
        </div>
      </div>
      <div class="field">
        <label class="label" for="comment">Комментарий</label>
        <div class="control">
          <textarea class="textarea" id="comment" name="comment" rows="3"></textarea>
        </div>
      </div>
      <div class="control">
        <button type="submit" class="button js-signup-btn">Отправить заявку</button>
      </div>
    </form>
  </div>
</section>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const specialistSelect = document.getElementById('specialist');
  const contactSection = document.getElementById('contact');
  document.querySelectorAll('.specialists-grid .js-signup-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      if (btn.dataset.specialist) {
        specialistSelect.value = btn.dataset.specialist;
      }
      contactSection.scrollIntoView({ behavior: 'smooth' });
    });
  });

  const filterBtns = document.querySelectorAll('.js-filter-btn');
  const columns = document.querySelectorAll('.column[data-categories]');

  const filter = (category) => {
    filterBtns.forEach(b => b.classList.toggle('is-active', b.dataset.filter === category));
    columns.forEach(col => {
      const cats = col.dataset.categories.split(',').map(c => c.trim());
      col.classList.toggle('is-hidden', !cats.includes(category));
    });
  };

  filterBtns.forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      filter(btn.dataset.filter);
    });
  });

  if (filterBtns.length > 0) {
    filter(filterBtns[0].dataset.filter);
  }
});
</script>

{{ end }}
