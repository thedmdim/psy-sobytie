{{ define "css" }}
<link rel="stylesheet" href="/css/specialists.css">
{{ end }}

{{ define "main" }}

<nav class="navbar has-shadow" role="navigation" aria-label="specialist navigation">
  <div class="container">
  <div class="navbar-brand">
    <a class="navbar-item" href="/" id="logo">
      <figure class="image">
        <img class="is-rounded" src="/images/logo.png" loading="lazy" decoding="async">
      </figure>
    </a>
  </div>
  <div class="navbar-menu is-active">
    <a class="navbar-item" href="/specialists/">Все специалисты</a>
  </div>
  </div>
</nav>

<section class="section pt-3 pb-0">
  <div class="container">
    <div class="specialist-hero">
      <figure class="image">
        {{ with .Resources.Get .Params.detail_photo }}
          {{ partial "responsive-image.html" (dict "img" . "alt" $.Title "width" 600) }}
        {{ end }}
      </figure>
      <div class="specialist-overlay">
        <h1 class="specialist-title">{{ .Title }}</h1>
        <p class="specialist-subtitle">{{ .Params.subtitle }}</p>
      </div>
    </div>
    <div class="specialist-blocks">
      {{ range $i, $block := .Params.blocks }}
      <div class="specialist-block">
        <img class="block-icon" src="{{ $block.icon }}" alt="" loading="lazy" decoding="async">
        <div class="block-content">
          <span class="block-label is-size-7">{{ $block.label }}</span>
          <span class="block-text is-size-6">{{ $block.text }}</span>
        </div>
      </div>
      {{ end }}
    </div>
  </div>
</section>

<section class="section" id="contact">
  <div class="container">
    <h2 class="title is-3 mb-5">Форма для записи</h2>
    <form class="signup-form" method="POST" action="/submit">
      <input type="hidden" name="from" value="{{ .Title }}">
      <div class="field">
        <label class="label" for="name">Имя</label>
        <div class="control">
          <input class="input" type="text" id="name" name="name" placeholder="Имя" required>
        </div>
      </div>
      <div class="field">
        <label class="label" for="phone">Телефон</label>
        <div class="control">
          <input class="input" type="tel" id="phone" name="phone" placeholder="+7" required>
        </div>
      </div>
      <div class="field">
        <label class="label" for="specialist">Специалист</label>
        <div class="control">
          <input class="input" type="text" id="specialist" name="specialist" value="{{ .Title }}" readonly>
        </div>
      </div>
      <div class="field">
        <label class="label" for="comment">Комментарий</label>
        <div class="control">
          <textarea class="textarea" id="comment" name="comment" rows="3"></textarea>
        </div>
      </div>
      <div class="field">
        <label class="checkbox">
          <input type="checkbox" name="consent">
          Я соглашаюсь с <a href="{{ "offer" | relURL }}" target="_blank" rel="noopener">договором-офертой</a> и <a href="{{ "privacy-policy" | relURL }}" target="_blank" rel="noopener">политикой конфиденциальности</a>
        </label>
      </div>
      <div class="control">
        <button type="submit" class="button js-signup-btn">Отправить заявку</button>
      </div>
    </form>
  </div>
</section>

{{ end }}
