{{ define "css" }}
<link rel="stylesheet" href="/css/specialists.css">
{{ end }}

{{ define "main" }}

<nav class="navbar has-shadow" role="navigation" aria-label="specialist navigation">
  <div class="container">
  <div class="navbar-brand">
    <a class="navbar-item" href="/" id="logo">
      <figure class="image">
        <img class="is-rounded" src="/images/logo.png" loading="lazy" decoding="async">
      </figure>
    </a>
  </div>
  <div class="navbar-menu is-active">
    <a class="navbar-item" href="/specialists/">Все специалисты</a>
  </div>
  </div>
</nav>

<section class="section pt-3 pb-0">
  <div class="container">
    <div class="specialist-hero">
      <figure class="image">
        {{ with .Resources.Get .Params.detail_photo }}
          {{ partial "responsive-image.html" (dict "img" . "alt" $.Title "width" 600) }}
        {{ end }}
      </figure>
      <div class="specialist-overlay">
        <h1 class="specialist-title">{{ .Title }}</h1>
        <p class="specialist-subtitle">{{ .Params.subtitle }}</p>
      </div>
    </div>
    <div class="specialist-blocks">
      {{ range $i, $block := .Params.blocks }}
      <div class="specialist-block">
        <img class="block-icon" src="{{ $block.icon }}" alt="" loading="lazy" decoding="async">
        <div class="block-content">
          <span class="block-label is-size-7">{{ $block.label }}</span>
          <span class="block-text is-size-6">{{ $block.text }}</span>
        </div>
      </div>
      {{ end }}
    </div>
  </div>
</section>

<section class="section" id="contact">
  <div class="container">
    <h2 class="title is-3 mb-5">Форма для записи</h2>
    <script data-b24-form="inline/1/dfqtog" data-b24-form-telemetry-sign="v1:1:site.66207a40e4b9288a9d878d7e884aa7ce76cc4da05c90da3421efaaba94d2b03c" data-skip-moving="true">(function(w,d,u){var s=d.createElement('script');s.async=true;s.src=u+'?'+(Date.now()/180000|0);var h=d.getElementsByTagName('script')[0];h.parentNode.insertBefore(s,h);})(window,document,'https://cdn-ru.bitrix24.ru/b39234292/crm/form/loader_1.js');</script>
  </div>
</section>

{{ end }}
