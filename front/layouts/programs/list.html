{{ define "css" }}
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/programs.css">
{{ end }}

{{ define "main" }}

<nav class="navbar has-shadow" role="navigation" aria-label="specialists navigation">
  <div class="navbar-brand">
    <a class="navbar-item" href="/" id="logo">
      {{ .Site.Title }}
    </a>
  </div>
  <div class="navbar-menu is-active">
  {{ range .Params.nav }}
    <a class="navbar-item" href="{{ .url }}">{{ .label }}</a>
  {{ end }}
  </div>
</nav>

<section class="section">
    <h2 class="title is-1">{{ .Title }}</h1>
    {{ range .Params.groups }}
      <h2 class="title is-3">{{ .name }}</h2>
      <div class="columns is-multiline">
        {{ range .sections }}
          <div id="{{ .url }}" class="column is-one-third-desktop is-half-tablet">
            <a class="card is-block" href="{{ .url }}">
              <div class="card-image">
                <figure class="image is-1by1">
                  <img src="{{ .url }}/{{ .photo }}" alt="{{ .name }}">
                </figure>
              </div>
              <div class="card-content has-background-link has-text-white">
                <p class="title is-6 has-text-white">{{ .name }}</p>
              </div>
            </a>
          </div>
        {{ end }}
      </div>
    {{ end }}
  
</section>

{{ end }}
