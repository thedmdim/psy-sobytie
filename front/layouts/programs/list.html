{{ define "css" }}
<link rel="stylesheet" href="/css/programs.css">
{{ end }}

{{ define "main" }}

<nav class="navbar is-sticky" role="navigation" aria-label="page sections">
    <div class="container">
      <div class="navbar-brand">
        <a class="navbar-item" href="/">
          <figure class="image">
            <img class="is-rounded" src="/images/logo.png" alt="СО-БЫТИЕ" loading="lazy" decoding="async">
          </figure>
          <span class="navbar-brand-text has-text-weight-bold is-size-5">СО-БЫТИЕ</span>
        </a>

        <a role="button" class="navbar-burger" data-target="programNavbar" aria-label="menu" aria-expanded="false">
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
        </a>
      </div>
      <div class="navbar-menu" id="programNavbar">
        <div class="navbar-start program-navbar-items">
          {{ range .Params.nav }}
          <a class="navbar-item" href="{{ .url }}">{{ .label }}</a>
          {{ end }}
        </div>
      </div>
    </div>
  </nav>

<section class="section" id="programs-list">
    <h2 class="title is-1">{{ .Title }}</h2>
    {{ range .Params.groups }}
      <h2 class="title is-3" id="{{ .slug }}">{{ .name }}</h2>
      <div class="program-circle-grid program-group-{{ .color }}">
        {{ range .sections }}
          <div id="{{ .url }}" class="program-circle-item">
            <a class="program-circle-link" href="{{ .url }}">
              <div class="program-circle">
                <img src="{{ .url }}/{{ .photo }}" alt="{{ .name }}" loading="lazy" decoding="async">
              </div>
              <span class="program-circle-label">{{ .name }}</span>
            </a>
          </div>
        {{ end }}
      </div>
    {{ end }}
  
</section>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var $burgers = document.querySelectorAll('.navbar-burger');
    for (var i = 0; i < $burgers.length; i++) {
      $burgers[i].addEventListener('click', function () {
        var target = document.getElementById(this.dataset.target);
        this.classList.toggle('is-active');
        target.classList.toggle('is-active');
      });
    }
  });
</script>

{{ end }}
