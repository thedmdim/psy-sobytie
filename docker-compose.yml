services:
  front:
    image: ghcr.io/thedmdim/new.psy-sobytie/front:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/data:/data
      - ./caddy/config:/config
    depends_on:
      - back

  back:
    image: ghcr.io/thedmdim/new.psy-sobytie/back:latest
    restart: unless-stopped
    environment:
      - VK_TOKEN=${VK_TOKEN}
      - VK_CHAT_ID=${VK_CHAT_ID}